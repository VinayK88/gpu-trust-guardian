<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">GPU Trust Guardian architecture</title>
  <desc id="desc">Synthetic or optional NVIDIA GPU telemetry and attestation flow through evidence, machine learning, attack paths, policy and guarded analyst outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff8e8"/><stop offset="0.55" stop-color="#ffffff"/><stop offset="1" stop-color="#fff7ed"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#365314"/><stop offset="1" stop-color="#142113"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#142113" flood-opacity="0.12"/></filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#dce8d5" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#5c7f2d"/></marker>
    <style>
      .title{font:700 36px Inter,Arial,sans-serif;fill:#fff}.subtitle{font:500 17px Inter,Arial,sans-serif;fill:#dff0cc}
      .h{font:700 20px Inter,Arial,sans-serif;fill:#142113}.p{font:500 14px Inter,Arial,sans-serif;fill:#52624f}
      .small{font:600 12px Inter,Arial,sans-serif;fill:#52624f}.mono{font:700 13px ui-monospace,SFMono-Regular,monospace;fill:#365314}
      .card{fill:#fff;stroke:#cddbc7;stroke-width:2}.green{fill:#eef8e6;stroke:#76b900;stroke-width:2}.orange{fill:#fff7ed;stroke:#f97316;stroke-width:2}
      .line{fill:none;stroke:#5c7f2d;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="760" rx="28" fill="url(#grid)" opacity="0.48"/>
  <rect x="48" y="38" width="1304" height="112" rx="22" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="88" y="88" class="title">GPU Trust Guardian</text>
  <text x="88" y="121" class="subtitle">Explainable trust decisions for GPU workloads, model access, and security-agent actions</text>
  <g transform="translate(1150 66)">
    <rect width="154" height="58" rx="15" fill="#76b900"/>
    <path d="M28 17h34v24H28zM34 11v6M43 11v6M52 11v6M34 41v6M43 41v6M52 41v6M22 23h6M22 32h6M62 23h6M62 32h6" fill="none" stroke="#142113" stroke-width="3" stroke-linecap="round"/>
    <text x="82" y="29" class="mono" fill="#142113">GPU</text><text x="82" y="45" class="small" fill="#284106">TRUST LAB</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="55" y="210" width="250" height="190" rx="20" class="card"/>
    <circle cx="100" cy="255" r="24" fill="#76b900"/><path d="M88 255h24M100 243v24" stroke="#fff" stroke-width="4"/>
    <text x="135" y="252" class="h">Signals</text>
    <text x="82" y="302" class="p">• Portable synthetic cyber range</text>
    <text x="82" y="330" class="p">• Optional NVML snapshot</text>
    <text x="82" y="358" class="p">• Workload + egress telemetry</text>
    <text x="82" y="386" class="p">• Morpheus-ready JSONL</text>

    <rect x="365" y="210" width="250" height="190" rx="20" class="green"/>
    <circle cx="410" cy="255" r="24" fill="#365314"/><path d="M397 256l9 9 18-21" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="445" y="252" class="h">Trust evidence</text>
    <text x="392" y="302" class="p">• Nonce and signature status</text>
    <text x="392" y="330" class="p">• Trusted measurement</text>
    <text x="392" y="358" class="p">• Confidential-compute mode</text>
    <text x="392" y="386" class="p">• Explicit production boundary</text>

    <rect x="675" y="210" width="250" height="190" rx="20" class="card"/>
    <circle cx="720" cy="255" r="24" fill="#2563eb"/><path d="M708 264c8-20 16-20 24 0M708 246h24" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="755" y="252" class="h">Analytics</text>
    <text x="702" y="302" class="p">• Digital fingerprints</text>
    <text x="702" y="330" class="p">• Supervised + anomaly ML</text>
    <text x="702" y="358" class="p">• Evidence rules</text>
    <text x="702" y="386" class="p">• Identity-to-GPU graphs</text>

    <rect x="985" y="210" width="360" height="190" rx="20" class="orange"/>
    <circle cx="1030" cy="255" r="24" fill="#f97316"/><path d="M1019 255h22M1030 244v22" stroke="#fff" stroke-width="4"/>
    <text x="1065" y="252" class="h">Policy gate</text>
    <g transform="translate(1015 292)"><rect width="88" height="38" rx="12" fill="#dcfce7"/><text x="44" y="25" text-anchor="middle" class="mono">ALLOW</text></g>
    <g transform="translate(1112 292)"><rect width="110" height="38" rx="12" fill="#fef3c7"/><text x="55" y="25" text-anchor="middle" class="mono" fill="#92400e">QUARANTINE</text></g>
    <g transform="translate(1231 292)"><rect width="86" height="38" rx="12" fill="#fee2e2"/><text x="43" y="25" text-anchor="middle" class="mono" fill="#991b1b">BLOCK</text></g>
    <text x="1015" y="364" class="p">Model keys and sensitive inputs are released</text>
    <text x="1015" y="387" class="p">only after evidence and authorization checks.</text>
  </g>

  <path d="M305 305H350" class="line"/><path d="M615 305H660" class="line"/><path d="M925 305H970" class="line"/>

  <g filter="url(#shadow)">
    <rect x="120" y="500" width="345" height="170" rx="20" class="card"/>
    <text x="150" y="542" class="h">Guarded analyst agent</text>
    <text x="150" y="579" class="p">Prompt-injection and secret checks</text>
    <text x="150" y="607" class="p">Tool allowlist + human approval</text>
    <text x="150" y="635" class="p">Optional NeMo Guardrails template</text>

    <rect x="527" y="500" width="345" height="170" rx="20" class="green"/>
    <text x="557" y="542" class="h">Reviewable evidence</text>
    <text x="557" y="579" class="p">Executed notebooks · JSON reports</text>
    <text x="557" y="607" class="p">Attack paths · explanations · caveats</text>
    <text x="557" y="635" class="p">Deterministic fixtures · tests · CI</text>

    <rect x="934" y="500" width="345" height="170" rx="20" class="orange"/>
    <text x="964" y="542" class="h">Analyst action</text>
    <text x="964" y="579" class="p">Inspect evidence in Streamlit</text>
    <text x="964" y="607" class="p">Quarantine the narrowest workload</text>
    <text x="964" y="635" class="p">Escalate without hiding uncertainty</text>
  </g>
  <path d="M465 585H512" class="line"/><path d="M872 585H919" class="line"/>
  <path d="M1165 400C1165 455 1105 470 1105 486" class="line"/>
  <text x="700" y="724" text-anchor="middle" class="small">Independent educational project · CPU-runnable reference path · NVIDIA integrations are optional and explicitly bounded</text>
</svg>
