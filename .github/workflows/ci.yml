name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[app,notebooks,dev]"
      - name: Rebuild deterministic evidence
        run: python scripts/rebuild_artifacts.py
      - name: Rebuild and execute notebooks
        run: |
          python scripts/build_notebooks.py
          python scripts/execute_notebooks.py
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q src dashboard scripts tests
